<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tofadachi — taking you to the main site</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://tofadachiaianditsolutionsukltd.com/">
<!-- Works with scripting turned off. The script below is faster and keeps
     any section anchor, but this alone is enough to get people there. -->
<meta http-equiv="refresh" content="0; url=https://tofadachiaianditsolutionsukltd.com/">
<style>
  :root{
    --ink:#0f2e2e;
    --paper:#fbf7ee;
    --deep:#0d4d4d;
    --gold-deep:#8a6508;
    --focus:#ffb300;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
    color:var(--ink);
    font-family:Georgia,'Times New Roman',serif;
    font-size:20px;
    line-height:1.65;
    padding:32px 24px;
  }
  main{max-width:640px;}
  .eyebrow{
    font-family:Verdana,sans-serif;font-size:15px;letter-spacing:2px;
    text-transform:uppercase;color:var(--gold-deep);margin:0 0 14px;font-weight:bold;
  }
  h1{font-size:34px;line-height:1.25;margin:0 0 20px;color:var(--deep);}
  p{margin:0 0 20px;}
  a{color:var(--deep);text-underline-offset:3px;}
  a:focus-visible{
    outline:4px solid var(--focus);outline-offset:2px;
    box-shadow:0 0 0 8px var(--ink);border-radius:2px;
  }
  @media (max-width:600px){body{font-size:19px;}h1{font-size:28px;}}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Tofadachi AI and IT Solutions</p>
  <h1>Taking you to the main site.</h1>
  <p>The Tofadachi website lives at
    <a href="https://tofadachiaianditsolutionsukltd.com/">tofadachiaianditsolutionsukltd.com</a>.
    You should arrive there in a moment. If you do not, follow that link.</p>
</main>
<script>
  // Keep the section anchor and any query string, so a link to #products
  // still lands on the products section rather than the top of the page.
  location.replace("https://tofadachiaianditsolutionsukltd.com/" + location.search + location.hash);
</script>
</body>
</html>
